  <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#513326"/><stop offset=".5" stop-color="#241912"/><stop offset="1" stop-color="#75462a"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="175%">
