  </filter>
  <clipPath id="bodyClip"><ellipse cx="198" cy="178" rx="71" ry="67" transform="rotate(-12 198 178)"/></clipPath>
  <clipPath id="headClip"><circle cx="119" cy="135" r="64"/></clipPath>
</defs>
