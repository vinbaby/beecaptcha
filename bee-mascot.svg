<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="title desc">
<title id="title">BeeCaptcha fluffy bee mascot</title>
<desc id="desc">A cheerful fluffy golden bee with soft wings, glossy eyes and warm brown stripes.</desc>
<defs>
  <radialGradient id="headGold" cx="33%" cy="24%" r="82%">
    <stop offset="0" stop-color="#fff3ad"/><stop offset=".48" stop-color="#ffd34b"/><stop offset="1" stop-color="#f3a900"/>
  </radialGradient>
  <linearGradient id="bodyGold" x1="0" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#ffe77b"/><stop offset=".55" stop-color="#ffc228"/><stop offset="1" stop-color="#e99a00"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f8f1d9"/><stop offset="1" stop-color="#d8e6ef"/>
  </linearGradient>
  <radialGradient id="eye" cx="32%" cy="22%" r="78%">
    <stop offset="0" stop-color="#53616b"/><stop offset=".23" stop-color="#131b20"/><stop offset="1" stop-color="#020609"/>
