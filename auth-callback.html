<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in — BeeCaptcha</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="bee-core.js"></script>
</head>
<body><main class="auth">
<a class="brand" href="index.html">BeeCaptcha</a>
<div class="box">
<h1 id="title">Signing you in…</h1>
<p id="msg">Securely completing your sign-in.</p>
</div>
</main>
<script>
const {db}=Bee;
const params=new URLSearchParams(location.search);
const rawNext=params.get("next");
const safeNext=(rawNext&&/^[a-z0-9_./#?=&-]+$/i.test(rawNext))?rawNext:"dashboard.html";
const APP_ORIGIN="https://beecaptcha.vercel.app";

(async()=>{
  try{
    const code=params.get("code");
    if(code){
      const {error}=await db.auth.exchangeCodeForSession(code);
      if(error) throw error;
    }

    const {data,error}=await db.auth.getSession();
    if(error) throw error;

    if(data?.session){
      location.replace(APP_ORIGIN+"/"+safeNext.replace(/^\//,""));
      return;
    }

    const hashParams=new URLSearchParams(location.hash.slice(1));
    const errDesc=hashParams.get("error_description");
    document.getElementById("title").textContent="Sign-in link unavailable";
    document.getElementById("msg").textContent=
      errDesc ? decodeURIComponent(errDesc) :
      "The sign-in link may be expired or already used. Please request a new one.";
  }catch(error){
    document.getElementById("title").textContent="Sign-in failed";
    document.getElementById("msg").textContent=error?.message || "Unable to complete sign-in.";
  }
})();
</script></body></html>
